<svg viewBox="0 0 1024 1024" width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 深邃午夜蓝紫背景渐变 -->
    <radialGradient id="bgGrad" cx="60%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#050811"/>
    </radialGradient>
    
    <!-- 书页磨砂玻璃渐变 -->
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#A5B4FC" stop-opacity="0.6"/>
    </linearGradient>

    <!-- 神经脑图主干流光渐变 -->
    <linearGradient id="neuralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="48%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>

    <!-- 边框细腻高光 -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.1"/>
    </linearGradient>

    <!-- 辉光滤镜 -->
    <filter id="bloomGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- macOS 标准超级椭圆 Squircle 倒角 (连续曲率，22.5% 圆角半径) -->
  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="6"/>

  <!-- 内部背景环境氛围光晕 -->
  <circle cx="640" cy="480" r="260" fill="#6366F1" opacity="0.16" filter="url(#bloomGlow)"/>
  <circle cx="760" cy="360" r="180" fill="#38BDF8" opacity="0.18" filter="url(#bloomGlow)"/>

  <g filter="url(#bloomGlow)">
    <!-- 左侧底层书页（微透磨砂纸张阴影） -->
    <path d="M 224 664 Q 352 624 496 672 L 496 336 Q 352 288 224 328 Z" 
          fill="rgba(255,255,255,0.06)" 
          stroke="rgba(255,255,255,0.22)" 
          stroke-width="8" 
          stroke-linejoin="round"/>
          
    <!-- 左侧主书页（玻璃拟态白光浮雕） -->
    <path d="M 256 704 Q 376 656 512 704 L 512 352 Q 376 296 256 344 Z" 
          fill="rgba(255,255,255,0.12)" 
          stroke="url(#pageGrad)" 
          stroke-width="12" 
          stroke-linejoin="round"/>

    <!-- 书页内页极简横线（象征严谨排版与文本知识） -->
    <line x1="312" y1="432" x2="456" y2="416" stroke="rgba(255,255,255,0.35)" stroke-width="8" stroke-linecap="round"/>
    <line x1="312" y1="504" x2="440" y2="488" stroke="rgba(255,255,255,0.35)" stroke-width="8" stroke-linecap="round"/>
    <line x1="312" y1="576" x2="416" y2="560" stroke="rgba(255,255,255,0.35)" stroke-width="8" stroke-linecap="round"/>

    <!-- 中轴书脊能量光柱 -->
    <line x1="512" y1="352" x2="512" y2="704" stroke="#38BDF8" stroke-width="18" stroke-linecap="round"/>

    <!-- 右侧：自然延伸为发光的思维导图与神经脉络 -->
    <path d="M 512 352 C 600 288 680 264 784 296" fill="none" stroke="url(#neuralGrad)" stroke-width="18" stroke-linecap="round"/>
    <path d="M 512 512 C 616 512 664 424 792 456" fill="none" stroke="url(#neuralGrad)" stroke-width="16" stroke-linecap="round"/>
    <path d="M 512 704 C 608 672 696 712 776 744" fill="none" stroke="url(#neuralGrad)" stroke-width="18" stroke-linecap="round"/>

    <!-- 脑图次级脉络光带连线（虚线跃迁） -->
    <line x1="784" y1="296" x2="792" y2="456" stroke="#818CF8" stroke-width="7" stroke-dasharray="12,12" opacity="0.7"/>
    <line x1="792" y1="456" x2="776" y2="744" stroke="#C084FC" stroke-width="7" stroke-dasharray="12,12" opacity="0.7"/>

    <!-- 节点晶核 1 (电光青蓝 · 顶部思维节点) -->
    <circle cx="784" cy="296" r="32" fill="#38BDF8"/>
    <circle cx="784" cy="296" r="14" fill="#FFFFFF"/>

    <!-- 节点晶核 2 (科技鸢尾紫 · 中部伴读晶核) -->
    <circle cx="792" cy="456" r="28" fill="#818CF8"/>
    <circle cx="792" cy="456" r="12" fill="#FFFFFF"/>

    <!-- 节点晶核 3 (星云粉紫 · 底部知识汇聚节点) -->
    <circle cx="776" cy="744" r="34" fill="#F472B6"/>
    <circle cx="776" cy="744" r="15" fill="#FFFFFF"/>

    <!-- 沿脉络游动的思维微光粒子 -->
    <circle cx="632" cy="312" r="10" fill="#BAE6FD"/>
    <circle cx="664" cy="480" r="8" fill="#DDD6FE"/>
    <circle cx="656" cy="716" r="9" fill="#FBCFE8"/>
  </g>
</svg>
